<body>
<header><button class="headbtn menu" id="menu" aria-label="필드 목록 열기" aria-expanded="false">목록</button><a href="#home" class="brand">NVMe <span style="font-weight:400;color:#b8d6d4">/</span> Identify<small>CNS 01h · CONTROLLER</small></a><div class="headinfo">BASE 2.1 · NVM 1.1 · OCP 2.6<br>한국어 통합 참조 · 오프라인</div><button class="headbtn" id="checksBtn"><span class="wide-label">정합성 전체보기</span><span class="narrow-label">정합성표</span></button><button class="headbtn" id="refsBtn">관련 규정</button><button class="headbtn" id="helpBtn">사용 안내</button></header>
<aside aria-label="필드 탐색"><div class="controls"><div class="search"><input id="search" type="search" placeholder="필드 · 설명 · 오프셋 검색" aria-label="필드 또는 관련 규정 검색"><button class="clear" id="clear" aria-label="검색 초기화">×</button></div><div class="controlrow"><select id="kind" aria-label="탐색 종류"><option value="fields">Identify 필드</option><option value="references">관련 규정</option><option value="all">전체</option></select><select id="sort" aria-label="탐색 순서"><option value="offset">오프셋 순</option><option value="topic">주제별</option></select></div><div class="controlrow"><select id="topic" aria-label="주제 필터"><option value="">모든 주제</option></select></div><label class="check"><input id="reserved" type="checkbox">예약 영역도 표시</label><div class="navcount" id="navcount" aria-live="polite"></div></div><nav id="navlist" class="navlist"></nav><div class="navfoot">능력 · 현재 상태 · 값 변경 조건을 구분합니다.</div></aside>
<main><div class="topbar"><a href="#home">전체 개요</a><span> / 적용 대상</span><select id="transport" aria-label="Transport 선택"><option value="pcie">PCIe / memory-based</option><option value="fabrics">Fabrics / message-based</option></select><select id="controller" aria-label="Controller 유형 선택"><option value="io">I/O controller</option><option value="admin">Administrative</option><option value="disc">Discovery</option></select><button class="copy" id="copy">직접 링크 복사</button></div><article id="content" tabindex="-1"></article></main><div class="toast" id="toast" role="status"></div>
<script id="spec-data" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('spec-data').textContent);
const all=[...D.fields,...D.references], byId=new Map(all.map(n=>[n.id,n]));
const $=id=>document.getElementById(id), escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=id=>'#'+encodeURIComponent(id), link=(id,label)=>`<a class="jump" href="${hash(id)}">${escape(label||byId.get(id)?.id||id)}</a>`;
const isReserved=n=>n.id.startsWith('RESERVED_');
const docName=d=>({base:'Base 2.1',nvm:'NVM Command Set 1.1',ocp:'OCP DSSD 2.6'}[d]||D.documents[d]?.title||d);
const pdfLink=s=>`../${encodeURIComponent(D.documents[s.doc].filename)}#page=${s.pdf_page}`;
const sourceText=s=>`${docName(s.doc)} · §${s.section}${s.requirement?" · "+s.requirement:""}${s.figure?' · Figure '+s.figure:s.figures?.length?' · 페이지 도표 '+s.figures.join(', '):''} · 인쇄 p.${s.page} / PDF p.${s.pdf_page}`;
const sourceHtml=s=>`<span class="sourcetag">${escape(sourceText(s))}</span> <a href="${pdfLink(s)}" target="_blank" rel="noopener">PDF 위치 ↗</a>`;
const norms=t=>[...new Set((String(t).toLowerCase().match(/\b(shall|should|may)\b/g)||[]))].map(v=>`<span class="norm">${v.toUpperCase()} · ${{shall:'필수',should:'권고',may:'허용'}[v]}</span>`).join('');
let current='home';
for(const t of [...new Set(D.fields.map(n=>n.topic))])$('topic').insertAdjacentHTML('beforeend',`<option>${escape(t)}</option>`);
const searchText=new Map(all.map(n=>[n.id,[n.id,n.name,n.title,n.ko,n.start,n.end,n.start!=null?'0x'+n.start.toString(16):'',n.topic,...(n.bits||[]).flatMap(b=>[b.title,b.ko]),...(n.edges||[]).map(e=>[e.target,e.text].join(' '))].join(' ').toLowerCase()]));
function nav(){
 const q=$('search').value.trim().toLowerCase(),kind=$('kind').value,topic=$('topic').value;
 const offset=/^(?:\d+|0x[0-9a-f]+)$/.test(q)?Number(q):null;
 let nodes=all.filter(n=>(kind==='all'||(kind==='fields'?!n.kind:!!n.kind))&&(!topic||n.topic===topic)&&($('reserved').checked||!isReserved(n))&&(!q||(offset!==null?n.start!=null&&n.start<=offset&&offset<=n.end:searchText.get(n.id).includes(q))));
 if($('sort').value==='topic')nodes.sort((a,b)=>a.topic.localeCompare(b.topic,'ko')||(a.start??99999)-(b.start??99999));
 $('navcount').textContent=`${nodes.length}개 항목${q?' · 검색 결과':''}`;
 let group='';$('navlist').innerHTML=nodes.map(n=>{
  let heading='';if($('sort').value==='topic'&&group!==n.topic){group=n.topic;heading=`<div class="navgroup">${escape(group)}</div>`;}
  const pos=n.start!=null?`${n.start}–${n.end}`:n.id;
  return heading+`<button class="navitem ${current===n.id?'active':''}" data-id="${escape(n.id)}" ${current===n.id?'aria-current="page"':''}><strong>${escape(n.kind?n.title:n.id)}</strong>${!n.kind?`<span>${pos}</span>`:''}<small>${escape(n.kind?n.id:n.title)}</small></button>`;
 }).join('')||'<p class="empty">일치하는 항목이 없습니다.<br>검색어나 주제 필터를 바꿔 보세요.</p>';
}
function availability(n){
 if(n.kind)return '';
 const a=n.availability||[], idx={io:0,admin:1,disc:2}[$('controller').value];
 let v=(a[idx]||'R').replace(/\s+/g,'');
 const foot=(v.match(/\d+/)||[])[0];const letter=(v.match(/[MORP]/)||['R'])[0];
 let notes=[];let meaning={M:'필수 필드',O:'선택적 필드',R:'예약 필드',P:'사용 금지 (P · 원문 표기)'}[letter];
 if(foot==='2'&&$('transport').value==='pcie'){meaning='예약 필드';notes.push('각주 2: message-based controller에서는 필수 필드이며, memory-based controller에서는 예약 필드입니다.');}
 else if(foot==='2')notes.push('각주 2: message-based controller에서는 필수 필드입니다.');
 if(foot==='3')notes.push('각주 3: explicit persistent connection을 지원하는 Discovery controller에서는 필수 필드입니다. 지원하지 않으면 예약 필드입니다.');
 if(foot==='4')notes.push('각주 4: Discovery controller에서는 CTRATT.TBKAS만 선택적 비트이며, 나머지 비트는 예약되어 있습니다.');
 if(foot==='5')notes.push('각주 5: Discovery가 SN 또는 MN 하나를 non-null로 보고하면 둘 모두 non-null이어야 합니다.');
 if(n.id==='MAXCMD')notes.push('본문의 적용 조건: Fabrics에서는 필수 필드, PCIe에서는 선택적 필드입니다. 사용하지 않으면 0을 보고합니다.');
 if(n.id==='MAXCMD'&&$('transport').value==='pcie')meaning='선택적 필드';
 if(isReserved(n))meaning=n.start===240?'NVMe-MI용 예약 영역':'예약 영역';
 const table=a.length?`원문 I/O / Admin / Disc: ${a.map(x=>x.replace(/\s+/g,'')).join(' / ')}`:'원문 Reserved 영역';
 const invalid=$('transport').value==='pcie'&&$('controller').value==='disc';
 const target=($('transport').value==='pcie'?'PCIe':'Fabrics')+' / '+{io:'I/O controller',admin:'Administrative controller',disc:'Discovery controller'}[$('controller').value];
 return `<div class="contextnote"><b>${escape(target)} 기준: ${escape(meaning)}</b> <span class="tiny"> · ${escape(table)}</span>${notes.map(t=>`<div>${escape(t)}</div>`).join('')}${invalid?'<div>Discovery controller는 Fabrics를 선택해서 확인하세요. PCIe와 Discovery의 조합은 실제 지원 구성을 뜻하지 않습니다.</div>':''}</div>`;
}
function english(text,label='대응 영문 원문 펼치기'){return `<details><summary>${escape(label)} ${norms(text)}</summary><pre>${escape(text)}</pre></details>`;}
function bitsTable(n){
 const psd=n.psd_index!=null,bits=psd?D.psd:n.bits;
 if(!bits?.length)return '';
 return `<h2 id="bits">${psd?'Power State Descriptor 전체 비트 정의':'비트와 값 정의'}</h2>${psd?`<p class="tiny">PS${n.psd_index} 시작 offset ${n.start}. 비트 번호는 32바이트 descriptor 내부 기준입니다. 각 행에서 대응 영문과 근거를 펼칠 수 있습니다.</p>`:''}<div class="tablewrap"><table><thead><tr><th style="width:85px">Bits</th><th>한국어 정의 · 조건 · 특수값</th></tr></thead><tbody>${bits.map(b=>`<tr><td>${escape(b.range)}</td><td><div class="bittitle">${escape(b.title||b.id)}</div>${escape(b.ko)}${english(b.english,'영문 정의와 근거')}<div class="source">${sourceHtml(b.source)}</div></td></tr>`).join('')}</tbody></table></div>${psd?`<h3 style="margin-top:20px">PLS 시간 scale · Figure 314</h3><p class="tiny">0h~Ch의 scale은 10^값 μs입니다. 시간 필드 0은 미보고이며 대응 scale도 0이어야 합니다. Dh~Fh는 Reserved입니다.</p><div class="tablewrap"><table><thead><tr><th>Scale</th><th>단위</th></tr></thead><tbody>${D.time_scales.map(x=>`<tr><td>${x.value}</td><td>${x.microseconds.toLocaleString()} μs${x.microseconds>=1000000?' = '+(x.microseconds/1000000).toLocaleString()+' s':''}</td></tr>`).join('')}</tbody></table></div><p class="source">Base 2.1 · §5.1.13.2.1 · Figure 314 · 인쇄 p.331 / PDF p.353</p>`:''}`;
}
function ruleOrigin(r){return r.standard==='ocp'?`<span class="pill green">OCP 2.6 · ${escape([...new Set(r.sources.map(s=>s.requirement))].join(', '))}</span>`:'<span class="norm">NVMe</span>'; }
function rulesHtml(n){return `<h2 id="checks">정합성 확인 조건 <span class="tiny">${n.rules.length}개 · 수동 검토</span></h2>${n.rules.some(r=>r.standard==='ocp')?'<div class="notice">OCP 조건은 PCIe DSSD 2.6 적용 제품에만 해당합니다. 고객의 항목별 프로파일과 예외를 먼저 확인하세요. <a href="#ocp">OCP 적용 범위·추가 확인 항목</a></div>':''}${n.rules.length?n.rules.map((r,i)=>`<div class="rule"><div class="rulehead"><span class="norm">${escape(r.level)}</span><span class="norm">${escape(r.check_kind||'')}</span><span> · 조건 ${i+1} · </span>${ruleOrigin(r)}</div><dl class="rulegrid">${r.field_applicability?`<dt>적용 대상</dt><dd>${escape(r.field_applicability)}</dd>`:''}<dt>적용 조건</dt><dd>${escape(r.condition)}</dd><dt>확인할 값</dt><dd>${escape(r.observe)}</dd><dt>만족해야 할 조건 / 동작</dt><dd>${escape(r.expected)}</dd></dl><div class="source">${r.sources.map(sourceHtml).join('<br>')}</div></div>`).join(''):'<p class="tiny">이 항목에는 다른 값과 비교하는 별도 검토 조건이 없습니다. 필드 정의와 적용 대상, 관련 규정을 확인하세요.</p>'}`;}
function edgeHtml(e,reverse=false){const n=byId.get(e.target);return `<div class="relation"><div class="relationhead"><span class="reltype">${escape(e.type)}</span>${link(n.id,n.kind?n.title:n.id+' · '+n.title)}</div><p>${escape(e.text)}</p>${!reverse&&n.kind?`<div class="source">${sourceHtml(n.sources[0])}</div>`:''}</div>`;}
function interpretationHtml(n){return n.interpretation_notes?.length?`<details><summary>값 해석과 주의사항 · 정합성 조건 수에 포함하지 않음</summary><div class="inner">${n.interpretation_notes.map(x=>`<p>${escape(x.text)}</p><div class="source">${x.sources.map(sourceHtml).join('<br>')}</div>`).join('')}</div></details>`:'';}
function renderField(n){
 const psd=n.psd_index!=null;
 return `<div class="hero"><div class="eyebrow">CNS 01h / ${escape(n.topic)}</div><h1>${escape(n.id)} <span style="font-weight:450">${escape(n.title)}</span></h1><p>${escape(n.name)}</p></div><div class="pills"><span class="pill green">Byte ${n.end}:${n.start}</span><span class="pill">0x${n.start.toString(16).toUpperCase().padStart(3,'0')}–0x${n.end.toString(16).toUpperCase().padStart(3,'0')}</span><span class="pill">${n.end-n.start+1} B</span>${n.nvm_english?'<span class="pill green">Base + NVM 통합</span>':''}</div>${availability(n)}${n.notes.map(t=>`<div class="notice"><b>원문 주의사항</b><br>${escape(t)}</div>`).join('')}<div class="metagrid"><div class="card"><div class="label">위치와 크기</div><b>${n.start}–${n.end} · ${n.end-n.start+1}바이트</b><span>4096바이트 응답 내 offset</span></div><div class="card"><div class="label">표현</div><b>${escape(n.encoding)}</b><span>필드별 예외는 아래 설명을 확인하세요.</span></div><div class="card"><div class="label">단위와 계산</div><b>${escape(n.unit)}</b></div></div><div class="sectionnav"><a href="#meaning" data-scroll="meaning">의미</a>${psd||n.bits.length?'<a href="#bits" data-scroll="bits">비트 정의</a>':''}<a href="#relations" data-scroll="relations">관련 규정</a><a href="#checks" data-scroll="checks">정합성 조건</a><a href="#sources" data-scroll="sources">근거</a></div><h2 id="meaning">의미와 해석</h2><p class="lead">${escape(n.ko)}</p>${english(n.english,'Base 2.1 대응 영문')}${n.nvm_english?english(n.nvm_english,'NVM Command Set 1.1 보충 영문'):''}${bitsTable(n)}${interpretationHtml(n)}<h2 id="relations">관련 규정과 값</h2><p class="tiny">관계 종류를 확인하세요. 관련성이 곧 Identify 값 변경을 의미하지 않습니다.</p>${n.edges.length?n.edges.map(e=>edgeHtml(e)).join(''):'<p class="tiny">연결된 내부 항목이 없습니다.</p>'}${n.external.length?`<div class="card"><h3>추가로 필요한 자료</h3>${n.external.map(id=>D.external.find(x=>x.id===id)).filter(Boolean).map(x=>`<p><b>${escape(x.title)}</b>: ${escape(x.needed)}</p>`).join('')}</div>`:''}${rulesHtml(n)}${n.incoming.length?`<details><summary>이 항목을 참조하는 항목 · 역방향 ${n.incoming.length}개</summary><div class="inner">${n.incoming.map(e=>edgeHtml(e,true)).join('')}</div></details>`:''}${sourcesHtml(n)}`;
}
function sourcesHtml(n){return `<h2 id="sources">근거와 외부 확인 항목</h2><ul class="sources">${n.sources.map(s=>`<li>${sourceHtml(s)}</li>`).join('')}</ul>${n.external.map(id=>{const e=D.external.find(x=>x.id===id);return `<div class="notice"><b>추가 근거 필요 · ${escape(e.title)}</b><br>${escape(e.needed)}</div>`;}).join('')}<div class="footer">두 PDF의 지정 버전 기준 · 한국어 설명은 필드 중심으로 재구성한 해설입니다. SHALL(필수) / SHOULD(권고) / MAY(허용)를 구분합니다.</div>`;}
function renderRef(n){return `<div class="hero"><div class="eyebrow">${docName(n.sources[0].doc)} / 관련 규정</div><h1>${escape(n.title)}</h1><p>§${escape(n.sources[0].section)} · ${escape(n.name)}</p></div><p class="lead">${escape(n.ko)}</p>${n.notes.map(t=>`<div class="notice">${escape(t)}</div>`).join('')}<h2>연결된 Identify 필드</h2>${n.incoming.length?n.incoming.map(e=>edgeHtml(e,true)).join(''):'<p class="tiny">관련 필드 설명의 보충 규정입니다.</p>'}${n.rules.length?rulesHtml(n):''}<h2>영문 원문 (해당 페이지)</h2><p class="tiny">아래는 해당 절이 위치한 원문 페이지의 추출 텍스트입니다. 같은 페이지에 다른 절이 포함될 수 있으며 도표 이미지는 PDF에서 확인할 수 있습니다.</p>${n.sources.map(s=>english(s.english,`${sourceText(s)} · 영문 페이지 펼치기`)).join('')}${sourcesHtml(n)}`;}
function home(){const count=D.fields.filter(n=>!isReserved(n)&&n.psd_index==null).length;return `<div class="hero"><div class="eyebrow">NVMe 스펙 한국어 설명</div><h1>Identify Controller<br>CNS 01h 필드 설명과 관련 규정</h1><p>CNS 01h의 의미와 비트 정의, 다른 절의 규정, Feature·Log·상태와의 관계를 모았습니다. 왼쪽에서 필드를 선택하거나 아래 항목에서 관련 내용을 찾아보세요.</p></div><div class="pills"><span class="pill green">Base 2.1 + NVM Command Set 1.1</span><span class="pill">PCIe NVM SSD 기본</span><a class="pill green" href="#ocp">OCP 2.6 추가 조건</a><span class="pill">서버·설치 없이 사용</span><span class="pill">장치 연결 없이 수동 검토</span><a class="pill green" href="#editorial">전체 필드 재점검 내역</a></div><div class="stats"><div class="stat"><b>${count}</b><span>정의된 일반 필드·영역</span></div><div class="stat"><b>${D.fields.reduce((a,f)=>a+f.bits.length,0)}</b><span>필드 비트 범위 · 예약 포함</span></div><div class="stat"><b>32 / ${D.psd.length}</b><span>Power State / PSD 비트 범위</span></div><div class="stat"><b>${D.references.length}</b><span>통합된 관련 절</span></div></div><h2>주요 확인 항목</h2><div class="grid">${[
 ['캐시와 데이터 영속성','캐시가 있는가, enable 상태인가, Flush와 FUA는 어떻게 동작하는가를 나눠 확인합니다.',['VWC','AWUPF','base:5.1.25.1.4','base:7.2']],
 ['전원 상태와 자동 전환','지원 state 수·전력·지연과 현재 PS 및 APST 표를 함께 봅니다.',['NPSS','APSTA','PSD0','base:5.1.25.1.6']],
 ['Atomicity와 namespace','불변 controller baseline, namespace별 값, boundary, 현재 DN을 연결합니다.',['AWUN','AWUPF','ACWU','nvm:4.1.3.3']],
 ['전송 크기와 metadata','최소 페이지 단위·MEM과 command별 size limit을 구분합니다.',['MDTS','CTRATT','ONCS','nvm:4.1.5.4']],
 ['펌웨어 활성화','현재 리비전과 활성 slot, 다음 활성 slot, 처리 시간을 구분합니다.',['FR','FRMW','MTFA','MPTFAWR']],
 ['온도와 이벤트','보고 온도 기준, 설정 threshold, 현재 SMART 온도와 통지를 비교합니다.',['WCTEMP','HCTMA','TMPTHHA','OAES']]
 ].map(([title,text,keys],i)=>`<div class="card"><div class="label">항목 ${String(i+1).padStart(2,'0')}</div><h3>${title}</h3><p>${text}</p><div class="links">${keys.map(k=>link(k,byId.get(k).kind?byId.get(k).title:k)).join('')}</div></div>`).join('')}</div><h2>4096바이트 응답 레이아웃</h2><div class="card"><div class="map">${[[0,255,'Controller'],[256,511,'Admin'],[512,767,'NVM'],[768,1023,'NQN'],[1024,1791,'Reserved'],[1792,2047,'Fabrics'],[2048,3071,'PSD'],[3072,4095,'Vendor']].map(([a,b,t])=>`<button data-id="${D.fields.find(n=>n.start===a)?.id}" title="${a}–${b} B" style="flex:${b-a+1}">${t}</button>`).join('')}</div><div class="maplabels"><span>0x000 / Byte 0</span><span>0xFFF / Byte 4095</span></div><p style="margin-top:15px">예약 영역을 포함한 ${D.fields.length}개의 연속 범위를 대조했습니다.</p></div><h2>해석 시 주의사항</h2><div class="grid"><div class="card"><h3>능력·설정·상태는 다른 값</h3><p>APTS와 APSTE, VWCP와 WCE, SANICAP와 현재 진행 상태를 구분합니다. 관련 값이 바뀌었다고 Identify 값까지 바뀌는 것은 아닙니다.</p></div><div class="card"><h3>0의 의미는 필드마다 확인</h3><p>NPSS=0은 전원 상태 1개, MDTS=0은 최대 제한 미지정, VWCP=0은 캐시 없음입니다. 미보고·미지원·비활성화·예약을 구분합니다.</p></div></div><div class="notice"><b>원문 확인이 필요한 항목</b><br>ANACAP·FUSES·KPIOC·AWUPF에는 문구·참조 번호 불일치 또는 정의 공백이 있습니다. 각 필드에 근거와 함께 표시하며 임의로 확정 보정하지 않습니다.<div class="links" style="margin-top:8px">${['ANACAP','FUSES','KPIOC','AWUPF'].map(k=>link(k)).join('')}</div></div><div class="footer">지정된 두 PDF 버전을 기준으로 합니다. 실제 장치 덤프 자동 판정은 포함하지 않습니다. <a href="#help">사용법과 근거 범위</a></div>`;}

a-live="polite"></div><div class="field-map" id="field-map" aria-label="전체 필드 조건 맵"></div><h2>필드별 조건표</h2><p class="tiny">필드 맵을 누르면 아래 표의 해당 행으로 이동합니다. 기본 표시는 주요 조건 2개이며, 나머지는 펼쳐서 확인할 수 있습니다. 「모든 조건 펼치기」로 전체 조건을 한 번에 표시할 수 있습니다.</p><div class="tablewrap"><table class="check-table"><thead><tr><th>필드 / 범위</th><th>조건 분류 / 관련 항목</th><th>확인할 조건 · 근거</th></tr></thead><tbody id="overview-body"></tbody></table></div><div class="footer">${a.limitations.map(escape).join('<br>')}</div>`;

function overviewRule(r){return `<div class="check-item" data-check-id="${escape(r.id)}" data-standard="${escape(r.standard)}">${ruleOrigin(r)}<span class="norm">${escape(r.level)}</span><span class="norm">${escape(r.check_kind||'')}</span>${r.categories.map(c=>`<span class="cat-tag">${escape(c)}</span>`).join('')}<p class="tiny">${escape(r.field_applicability)}</p><p><strong>적용 조건:</strong> ${escape(r.condition)}</p><p><strong>확인할 값:</strong> ${escape(r.observe)}</p><p>${escape(r.expected)}</p><div class="source">${r.sources.map(sourceHtml).join('<br>')}</div></div>`;}
function updateOverview(){
 if(!$('overview-body'))return;
 const q=$('overview-search').value.trim().toLowerCase(),topic=$('overview-topic').value,cat=$('overview-category').value,status=$('overview-status').value,expanded=$('overview-expanded').checked,standard=$('overview-standard').value,exact=$('overview-search').dataset.field||'';
 const eligible=r=>(!standard||r.standard===standard)&&(!cat||r.categories.includes(cat));
 const nodes=D.fields.filter(f=>(!standard||f.rules.some(eligible))&&(!exact||f.id===exact)&&(!topic||f.topic===topic)&&(!status||f.overview_status===status)&&(!cat||f.check_categories.includes(cat))&&(!q||[f.id,f.title,f.ko,f.start,f.end,...f.rules.flatMap(r=>[r.condition,r.observe,r.expected])].join(' ').toLowerCase().includes(q)));
 $('overview-count').textContent=`${nodes.length} / ${D.fields.length}개 필드 범위 · ${nodes.reduce((n,f)=>n+f.rules.filter(eligible).length,0)}개 조건`;
 const colors=['#22887c','#426cba','#9770ac','#bc8942','#81929c'];
 $('field-map').innerHTML=nodes.map(f=>{const cats=f.check_categories.map(c=>D.consistency_audit.categories.indexOf(c));return `<button class="field-tile" data-overview-field="${escape(f.id)}" title="${escape(f.title+' · '+f.overview_status+' · '+f.check_categories.join(', '))}" style="border-top-color:${colors[cats[0]]||'#b8bac6'}"><b>${escape(f.id.replace('RESERVED_','RSV '))}</b><small>${f.rules.filter(eligible).length}개 조건</small><div>${cats.map(i=>`<i class="category-dot cat-${i}"></i>`).join('')}</div></button>`;}).join('');
 $('overview-body').innerHTML=nodes.map(f=>{
  const rules=f.rules.filter(eligible),related=[...new Set(rules.flatMap(r=>r.related_fields))],refIds=[...new Set(rules.flatMap(r=>r.related_refs))];
  return `<tr class="check-row" id="overview-field-${escape(f.id)}" data-field-id="${escape(f.id)}"><td>${link(f.id)}<div class="field-title">${escape(f.title)}<br>Byte ${f.end}:${f.start}</div><span class="status ${f.overview_status==='원문 주의'||f.overview_status==='외부 확인 포함'?'status-caution':f.overview_status==='Vendor 정의'?'status-vendor':''}">${escape(f.overview_status)}</span><details><summary>이 구성에서의 필드 분류</summary><div class="inner">${availability(f)}</div></details></td><td><div class="matrix-counts">${D.consistency_audit.categories.map((c,i)=>{const count=rules.filter(r=>r.categories.includes(c)).length;return count?`<span><i class="category-dot cat-${i}"></i>${escape(c)} ${count}</span>`:'';}).join('')}</div><div class="links">${related.map(id=>link(id)).join('')}</div>${refIds.length?`<details><summary>관련 규정 ${refIds.length}개</summary><div class="inner links">${refIds.map(id=>link(id,byId.get(id).title)).join('')}</div></details>`:''}</td><td>${f.notes.map(t=>`<div class="notice">${escape(t)}</div>`).join('')}${rules.slice(0,2).map(overviewRule).join('')}${rules.length>2?`<details class="remaining-checks" ${expanded?'open':''}><summary>나머지 조건 ${rules.length-2}개</summary><div class="inner">${rules.slice(2).map(overviewRule).join('')}</div></details>`:''}${!rules.length?`<p>${escape(f.overview_note)}</p>`:''}</td></tr>`;
 }).join('')||'<tr><td colspan="3">일치하는 항목이 없습니다. 검색어나 필터를 바꿔 보세요.</td></tr>';
}
function setupOverview(){
 const params=new URLSearchParams(current.includes('?')?current.split('?')[1]:'');
 if(params.get('standard'))$('overview-standard').value=params.get('standard');
 if(params.get('field')){$('overview-search').value=params.get('field');$('overview-search').dataset.field=params.get('field');}
 for(const id of ['overview-search','overview-standard','overview-topic','overview-category','overview-status','overview-expanded'])$(id).addEventListener(id==='overview-search'?'input':'change',()=>{if(id==='overview-search')$('overview-search').dataset.field='';updateOverview();});
 $('overview-reset').onclick=()=>{$('overview-search').value='';$('overview-search').dataset.field='';$('overview-standard').value='';$('overview-topic').value='';$('overview-category').value='';$('overview-status').value='';updateOverview();};
 updateOverview();
}
function ocpPage(){const a=D.ocp_audit;return `<div class="hero"><div class="eyebrow">OCP Datacenter NVMe SSD Specification / 2.6</div><h1>OCP 정합성 조건</h1><p>2024-09-25판 · CNS 01h의 보고 값과 관련 동작을 대상으로 정리했습니다.</p></div><div class="notice">${escape(a.scope)}에만 적용합니다. NVMe 선택 기능이 OCP에서는 필수 또는 금지일 수 있습니다. 고객의 §13 A/B 선택은 항목별로 다르며 여러 설정을 섞을 수 있습니다.</div><div class="stats"><div class="stat"><b>${a.requirements}</b><span>연결한 OCP Requirement ID</span></div><div class="stat"><b>${a.cases}</b><span>적용 조건별 정리 · PSD 반복 제외</span></div><div class="stat"><b>${a.fields}</b><span>OCP 조건이 연결된 필드·PSD</span></div><div class="stat"><b>${a.checks}</b><span>필드별 조건 · PSD 반복 포함</span></div></div><div class="links">${link('consistency?standard=ocp','OCP 조건만 전체보기')}${link('consistency','NVMe와 함께 비교')}</div><h2>적용 범위와 추가 확인 사항</h2>${a.limitations.map(t=>`<p class="notice">${escape(t)}</p>`).join('')}<h2>OCP 조건 목록</h2><div class="tablewrap"><table><thead><tr><th>필드·Requirement ID</th><th>적용 조건 / 확인할 값</th><th>만족해야 할 조건</th></tr></thead><tbody>${a.records.map(r=>`<tr><td><div class="links">${r.fields.map(id=>link(id)).join('')}</div><div class="links">${r.requirements.map(id=>link('ocp:'+id,id)).join('')}</div><p class="tiny">§${escape(r.section)} · 인쇄/PDF p.${r.page}</p></td><td>${escape(r.condition)}<p class="tiny">${escape(r.observe)}</p></td><td>${escape(r.expected)}<p class="tiny">${r.interpretation==='명시'?'OCP의 명시 요구':'OCP 요구와 NVMe 필드 정의를 연결한 설명 · 고정값을 임의로 추가하지 않음'}</p></td></tr>`).join('')}</tbody></table></div>`;}
function editorialPage(){const a=D.editorial_audit;return `<div class="hero"><div class="eyebrow">CNS 01h / 전체 필드 재점검</div><h1>정의와 정합성 조건 분리</h1><p>${escape(a.scope)}</p></div><p>비트 정의를 복사한 항목과 값 해석 안내 ${a.removed.length}개를 정합성 목록에서 분리했습니다. 설명 속 제약 ${a.added.length}개는 적용 조건·관측값·요구 관계를 구체적으로 작성했습니다.</p><div class="notice">「1=지원, 0=미지원」 같은 정의의 반복은 비트 설명에 있습니다. 형식·예약값의 실제 제약, 필드 사이의 관계, 명령의 요구 동작은 확인 조건에 남습니다. 숫자는 실제 장치 검증 완료 수가 아닙니다.</div><div class="links">${link('consistency','전체 조건표')}</div><h2>필드별 결과 · ${a.fields.length}개 범위</h2><div class="tablewrap"><table><thead><tr><th>필드</th><th>남긴 조건</th><th>별도 해석 안내</th><th>구분</th></tr></thead><tbody>${a.fields.map(f=>`<tr><td>${link(f.id)}</td><td>${f.checks}</td><td>${f.guidance}</td><td>${escape(f.status)}</td></tr>`).join('')}</tbody></table></div><h2>구체적 조건으로 다시 작성한 항목</h2>${a.added.map(r=>`<div class="card" style="margin:10px 0">${link(r.field)}<p>${escape(r.condition)}</p><p>확인할 값: ${escape(r.observe)}</p><p>${escape(r.expected)}</p></div>`).join('')}<h2>검토 범위</h2>${a.limitations.map(t=>`<p>${escape(t)}</p>`).join('')}`;}
function auditPage(){const a=D.consistency_audit;return `<div class="hero"><div class="eyebrow">CNS 01h / 재검토 기록</div><h1>정합성 조건 보완 내역</h1><p>${escape(a.scope)}</p></div><div class="notice">NVMe 검토 조건을 ${a.before_checks}개에서 ${a.nvme_checks}개로 보완했고 OCP 조건 ${D.ocp_audit.checks}개를 별도로 추가했습니다. 증가분에는 일반 형식·예약값과 32개 PSD의 반복 조건이 포함됩니다. 숫자만으로 모든 규정의 검증 완료를 뜻하지 않습니다.</div><div class="links">${link('consistency','전체 정합성표')}</div><h2>추가한 조건</h2><div class="tablewrap"><table><thead><tr><th>필드 / 분류</th><th>적용 조건</th><th>확인 내용과 근거</th></tr></thead><tbody>${a.additions.map(r=>`<tr><td>${link(r.field)}<br><span class="tiny">${escape(r.category)}</span></td><td>${escape(r.condition)}</td><td>${escape(r.expected)}<div class="source">${r.sources.map(sourceHtml).join('<br>')}</div></td></tr>`).join('')}</tbody></table></div><h2>검토 한계</h2>${a.limitations.map(t=>`<p class="tiny">${escape(t)}</p>`).join('')}`;}
function help(){return `<div class="hero"><div class="eyebrow">Guide / Version pinned</div><h1>사용 안내와 자료 범위</h1><p><a class="jump" href="user_guide.html" target="_blank" rel="noopener">사용 설명서 열기 ↗ · 화면별 사용법과 이전 수정 내역 구분</a></p><p>파일을 브라우저로 열면 사용할 수 있습니다. 열람에는 인터넷 연결·서버·Python이 필요하지 않습니다.</p></div><h2>사용법</h2><ol><li>왼쪽 검색에 약어·한국어 설명·영문 이름·10진 offset 또는 0x 시작 offset을 입력합니다.</li><li>상단에서 Transport와 Controller 유형을 선택하면 해당 필드의 적용 조건을 확인할 수 있습니다. 선택을 바꿔도 전체 필드 설명은 볼 수 있습니다.</li><li>관련 규정 버튼으로 같은 화면에서 참조를 읽습니다. 브라우저의 뒤로 가기로 이전 항목에 돌아갈 수 있습니다.</li><li>정합성 조건의 적용 조건에 해당하면 확인할 값을 모아 수동으로 검토합니다.</li><li>영문 원문을 펼쳐 SHALL/SHOULD/MAY를 대조합니다. PDF 위치는 원래 세 PDF 파일이 HTML의 상위 폴더에 있을 때 열립니다.</li></ol><h2>규정과 해설</h2><div class="grid"><div class="card"><h3>SHALL / SHOULD / MAY</h3><p>SHALL=필수, SHOULD=권고, MAY=허용입니다. 선택적 기능도 구현한 경우에는 그 규정을 따라야 합니다. 원문 불일치를 추정으로 확정하지 않습니다.</p></div><div class="card"><h3>M / O / R / P</h3><p>M=필수, O=선택, R=예약입니다. 일부 필드의 P는 prohibited 원문 표기를 보존했습니다. Figure 312 범례는 M/O/R만 설명하므로 이 차이도 표시합니다. 각주와 본문 조건이 우선합니다.</p></div></div><h2>추가 근거가 필요한 항목</h2>${D.external.map(e=>`<div class="card" style="margin:12px 0"><h3>${escape(e.title)}</h3><p>${escape(e.needed)}</p><div class="links" style="margin-top:10px">${e.fields.map(k=>link(k)).join('')}</div></div>`).join('')}<h2>콘텐츠와 재생성</h2><p>content.json은 열람용 구조화 데이터입니다. source/catalog.json에서 한국어·조건·원문 대응을 편집하고 빌더로 단일 HTML을 생성합니다. 과거 Python 편집 모듈은 이관 기록으로만 남겨 둡니다. 원문 재추출에는 extract_sources.py와 pdfplumber·pypdf를 사용합니다.</p>${D.notes.map(t=>`<p class="tiny">${escape(t)}</p>`).join('')}<h2>검증 범위</h2><p class="tiny">전체 4096바이트 연속성, 한국어 필드·비트 설명, PSD의 256비트, 참조 대상, 검토 조건의 출처를 검사합니다. FUSES 15:8 원문 정의 공백은 그대로 보고합니다. 실제 장치의 값 판정은 수행하지 않습니다.</p><details><summary>원문 PDF 버전 고정 정보</summary><pre>${escape(JSON.stringify(D.documents,null,2))}</pre></details><div class="footer">검색·내부 링크·영문 원문 열람은 모두 오프라인으로 작동합니다.</div>`;}

 try{current=decodeURIComponent(location.hash.slice(1)||'home');}catch{current='home';}

 nav();$('navlist').querySelector('.active')?.scrollIntoView({block:'nearest'});document.body.classList.remove('navopen');$('menu').setAttribute('aria-expanded','false');window.scrollTo(0,0);document.title=n?`${n.id} · ${n.title} | NVMe Identify`:'NVMe Identify Controller · 한국어 통합 참조';
}

$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('직접 링크를 복사했습니다.');}catch{toast('주소 표시줄의 전체 주소를 복사하세요.');}};
window.addEventListener('hashchange',display);
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('search').focus();}if(e.key==='Escape'){document.body.classList.remove('navopen');$('menu').setAttribute('aria-expanded','false');}});
display();
</script>
</body>
</html>
